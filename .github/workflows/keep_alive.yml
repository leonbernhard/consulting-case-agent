name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 4 hours (UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Check and Wake Up App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          url = 'https://leon-bernhard-case-agent.streamlit.app'
          print(f'Visiting {url}...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until='networkidle', timeout=60000)

              # Check for Streamlit's wake up buttons
              wake_button = page.locator('button:has-text(\"Wake\"), button:has-text(\"Get this app back up\")')
              
              if wake_button.count() > 0 and wake_button.first.is_visible():
                  print('App is sleeping. Clicking wake up button...')
                  wake_button.first.click()
                  page.wait_for_timeout(25000)  # Wait for container startup
                  print('Wake up signal sent successfully!')
              else:
                  print('App is already awake and active.')

              browser.close()
          "
